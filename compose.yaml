# Local data stores for development and tests.
# The API itself runs on the host (make dev). See docs/local-dev.md.
# Credentials match settings/common.py and tests/config.py (taiga/taiga/taiga).
services:
  postgres:
    image: postgres:13
    # Durability is not needed for a local database: this makes test
    # database creation and migrations much faster.
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    environment:
      POSTGRES_USER: taiga
      POSTGRES_PASSWORD: taiga
      POSTGRES_DB: taiga
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taiga -d taiga"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Optional: only needed when CELERY_ENABLED=True or the rabbitmq events
  # backend is used. Start it with: docker compose --profile async up -d
  rabbitmq:
    image: rabbitmq:3-management
    profiles: ["async"]
    environment:
      RABBITMQ_DEFAULT_USER: taiga
      RABBITMQ_DEFAULT_PASS: taiga
      RABBITMQ_DEFAULT_VHOST: taiga
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  postgres-data:
